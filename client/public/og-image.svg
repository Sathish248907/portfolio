<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f171c" />
      <stop offset="50%" stop-color="#17232b" />
      <stop offset="100%" stop-color="#1e2c33" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4a77d" />
      <stop offset="100%" stop-color="#e8e5dc" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#344b50" />
      <stop offset="100%" stop-color="#a8b5ae" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid Decoration -->
  <g opacity="0.08" stroke="#a8b5ae" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Content Group -->
  <g transform="translate(120, 140)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="340" height="38" rx="19" fill="#344b50" fill-opacity="0.4" stroke="#c4a77d" stroke-opacity="0.4" />
    <text x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="14" fill="#c4a77d" letter-spacing="2">PEACE HAVEN TECHNOLOGIES</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Engineering Ideas.
    </text>
    <text x="0" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#gold)" letter-spacing="-1">
      Empowering Industries.
    </text>

    <!-- Subtitle / Disciplines -->
    <text x="0" y="240" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="300" fill="#a8b5ae">
      Web Development • FinTech • Robotics &amp; Automation • Healthcare Solutions
    </text>

    <!-- Bottom URL & Location -->
    <g transform="translate(0, 310)">
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="16" fill="#c4a77d">
        https://peacehaven.tech
      </text>
      <text x="320" y="20" font-family="'Inter', sans-serif" font-size="14" fill="#a8b5ae">
        | North America &amp; Global Engineering Centers
      </text>
    </g>
  </g>
</svg>
